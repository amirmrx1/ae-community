name: Build AE APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses and install platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Deploy AI coach Worker to Cloudflare
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets are not set, skipping the coach Worker deploy. The APK will build without the AI coach connection."
            exit 0
          fi
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          get_sub() { curl -sS -H "$AUTH" "$API" | python3 -c "import sys,json; d=json.load(sys.stdin); print((d.get('result') or {}).get('subdomain') or '')"; }
          SUB=$(get_sub)
          if [ -z "$SUB" ]; then
            echo "No workers.dev subdomain yet, registering one"
            curl -sS -X PUT -H "$AUTH" -H "Content-Type: application/json" --data "{\"subdomain\":\"ae-$(openssl rand -hex 4)\"}" "$API" > /dev/null
            SUB=$(get_sub)
          fi
          if [ -z "$SUB" ]; then
            echo "::error::Could not read or create the workers.dev subdomain. Check that the API token has Workers Scripts edit permission and the Account ID is correct."
            exit 1
          fi
          KEY=$(printf 'ae-%s' "$CLOUDFLARE_ACCOUNT_ID" | sha256sum | cut -c1-32)
          (cd worker && npx --yes wrangler@4 deploy --var "APP_KEY:$KEY")
          URL="https://ae-coach.$SUB.workers.dev"
          printf 'window.AE_CONFIG = { AI_URL: "%s", KEY: "%s" };\n' "$URL" "$KEY" > www/config.js
          echo "Coach Worker: $URL"
          echo "Coach Worker: $URL" >> "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$URL/" | grep -q '"ok":true'; then echo "Worker is live"; exit 0; fi
            sleep 10
          done
          echo "::error::Worker deployed but did not answer on $URL"
          exit 1

      - name: Install deps
        run: npm ci

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AE.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AE-apk
          path: AE.apk

      - name: Publish APK as a release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AE.apk --title "AE latest" --notes "Latest AE build (commit ${GITHUB_SHA::7})" --target "$GITHUB_SHA"
